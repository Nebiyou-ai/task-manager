version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskdb
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: NeBiYoU2468
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: task-manager-api
    environment:
      DATABASE_URL: postgresql://devuser:NeBiYoU2468@postgres:5432/taskdb
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: sh -c "npx prisma migrate deploy && node src/index.js"

volumes:
  postgres_data:
